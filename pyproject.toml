[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplycheck"
version = "1.2.0"
description = "A local-first CSV data quality toolkit for supplier, product and material master data."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SupplyCheck Contributors"}]
keywords = ["csv", "data-quality", "procurement", "supplier", "product", "material-master", "sap-mm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
supplycheck = "supplycheck.cli:main"

[tool.setuptools.packages.find]
include = ["supplycheck*"]
